<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05071d" />
    <meta name="description" content="献给妈妈的沉浸式银河生日祝福" />
    <title>女神生日快乐 · 银河之礼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-4DWYN5Vh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C7GDqeo4.css">
  </head>
  <body>
    <main id="experience" aria-label="沉浸式生日银河互动场景">
      <canvas id="webgl" aria-hidden="true"></canvas>
      <div class="nebula nebula--one"></div>
      <div class="nebula nebula--two"></div>
      <div class="vignette"></div>

      <section id="loading" class="loading-screen" aria-live="polite">
        <div class="loading-star">✦</div>
        <p>正在点亮妈妈的生日星河</p>
        <div class="loading-track"><span id="loading-progress"></span></div>
      </section>

      <section id="intro-ui" class="intro-ui">
        <p class="eyebrow">A GIFT FROM THE GALAXY</p>
        <button id="gift-trigger" class="magic-hint" type="button">
          <span>轻触礼物</span>
          <small>开启属于妈妈的星河</small>
        </button>
      </section>

      <section id="blessing" class="blessing" aria-live="polite">
        <div class="blessing-spark blessing-spark--left">✦</div>
        <p class="blessing-kicker">TO MY DEAREST MOM</p>
        <h1>✨ 女神生日快乐 ✨</h1>
        <p class="blessing-subtitle">愿你的每一天<br />都如星河般璀璨</p>
        <div class="blessing-spark blessing-spark--right">✧</div>
      </section>

      <div id="cake-guide" class="cake-guide">
        <span class="guide-icon">↔</span>
        <span>轻拖微微转动 · 轻触绽放星光</span>
      </div>

      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="播放背景音乐">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="sound-label">音乐</span>
      </button>
      <div id="asset-notice" class="asset-notice" role="status"></div>
    </main>

    <audio id="birthday-music" loop preload="auto"></audio>
  </body>
</html>
